<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Neon Gravity - Secret Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>NEON GRAVITY</h1>
      <p class="tagline">
        Collect energy orbs before time runs out.
        Avoid the black hole. Escape the hunter drone.
      </p>

      <button id="startBtn">Start Game</button>

      <div class="help">
        Move: WASD / Arrow Keys<br />
        Mobile: Touch and drag anywhere<br /><br />
        Secrets are hidden.
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="hud-card">Score: <span id="score">0</span></div>
      <div class="hud-card">Lives: <span id="lives">❤❤❤</span></div>
      <div class="hud-card">Level: <span id="level">1</span></div>
      <div class="hud-card">Time: <span id="time">60</span></div>
      <div class="hud-card">Goal: <span id="goal">0/8</span></div>
    </div>

    <div id="message" class="hidden"></div>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div class="panel">
      <h2>GAME OVER</h2>
      <p id="gameOverReason"></p>

      <p class="final-score">
        Final Score: <span id="finalScore">0</span>
      </p>

      <p class="final-score">
        Level Reached: <span id="finalLevel">1</span>
      </p>

      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <div id="musicBar">
    <button id="musicToggle" type="button">♪</button>
    <button id="musicNext" type="button">Next</button>
    <button id="musicVolumeBtn" type="button">Vol 50%</button>
    <span id="musicLabel">♪ 1/6</span>
  </div>

  <script src="game.js"></script>
  <script src="music.js"></script>
</body>
  </html>
